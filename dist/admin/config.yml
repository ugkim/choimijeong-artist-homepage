backend:
  name: git-gateway
  branch: main

media_folder: public/uploads
public_folder: /uploads
publish_mode: editorial_workflow
locale: ko

collections:
  - name: settings
    label: 1. 홈페이지 설정
    files:
      - name: site
        label: 공통 설정
        file: content/site.json
        fields:
          - { label: 기본 언어, name: defaultLocale, widget: select, options: [ko, en] }
          - { label: 사용 언어, name: availableLocales, widget: select, multiple: true, options: [ko, en, ja, zh-CN, zh-TW, fr, de, es] }
          - { label: Hero 작품 ID, name: heroArtworkId, widget: string, required: false }
          - { label: 작가 또는 작업실 이미지, name: aboutImage, widget: image }
          - { label: 이미지 너비, name: aboutImageWidth, widget: number, value_type: int }
          - { label: 이미지 높이, name: aboutImageHeight, widget: number, value_type: int }
          - { label: 저작권 시작 연도, name: copyrightStartYear, widget: number, value_type: int }
          - label: 작품 목록 표시 설정
            name: artworksPage
            widget: object
            fields:
              - { label: 제목 표시, name: showTitle, widget: boolean, default: true }
              - { label: 제작연도 표시, name: showYear, widget: boolean, default: true }
              - { label: 재료 표시, name: showMedium, widget: boolean, default: false }
              - { label: 페이지당 작품 수, name: itemsPerPage, widget: number, value_type: int, min: 1 }
              - { label: 모바일 열 수, name: mobileColumns, widget: number, value_type: int, min: 1, max: 3 }
              - { label: 데스크톱 열 수, name: desktopColumns, widget: number, value_type: int, min: 2, max: 6 }
          - label: CV 페이지 설정
            name: cvPage
            widget: object
            fields:
              - { label: 연도 정렬, name: sortDirection, widget: select, options: [{ label: 최신순, value: desc }, { label: 오래된순, value: asc }] }
              - { label: 모바일 아코디언, name: mobileAccordion, widget: boolean, default: true }
              - { label: PDF 다운로드 표시, name: showPdfDownload, widget: boolean, default: true }
          - label: News 페이지 설정
            name: newsPage
            widget: object
            fields:
              - { label: 페이지당 소식 수, name: itemsPerPage, widget: number, value_type: int, min: 1 }
              - { label: 외부 링크로 바로 이동, name: directExternalLinks, widget: boolean, default: false }
          - label: SNS 및 연락처
            name: socials
            widget: object
            fields:
              - { label: Instagram, name: instagram, widget: string, required: false }
              - { label: YouTube, name: youtube, widget: string, required: false }
              - { label: Vimeo, name: vimeo, widget: string, required: false }
              - { label: Email, name: email, widget: string, required: false }
          - label: 메뉴
            name: menu
            widget: list
            fields:
              - { label: ID, name: id, widget: string }
              - { label: 경로, name: path, widget: string }
      - name: ko_site
        label: 한국어 사이트 텍스트
        file: content/locales/ko/site.json
        fields: &site_fields
          - { label: 작가명, name: artistName, widget: string }
          - { label: 영문 작가명, name: artistNameLatin, widget: string }
          - { label: 직업, name: occupation, widget: string }
          - { label: 메뉴, name: menu, widget: object, fields: [{ label: Main, name: main, widget: string }, { label: Works, name: artworks, widget: string }, { label: About, name: about, widget: string }, { label: CV, name: cv, widget: string }, { label: News, name: news, widget: string }, { label: Contact, name: contact, widget: string }] }
          - { label: Main 콘텐츠, name: main, widget: object, fields: [{ label: 작가노트, name: artistNote, widget: text }, { label: 작가노트 링크, name: artistNoteLink, widget: string }, { label: 작품 제목, name: worksTitle, widget: string }, { label: 작품 링크, name: worksLink, widget: string }, { label: 소개 제목, name: aboutTitle, widget: string }, { label: 소개 요약, name: aboutSummary, widget: text }, { label: 소개 링크, name: aboutLink, widget: string }] }
          - { label: 작품 목록 문구, name: works, widget: object, fields: [{ label: 제목, name: title, widget: string }, { label: 설명, name: description, widget: text }, { label: 전체, name: all, widget: string }, { label: 이전 페이지, name: previousPage, widget: string }, { label: 다음 페이지, name: nextPage, widget: string }, { label: 페이지 상태, name: pageStatus, widget: string, hint: '{current}, {total} 변수를 사용할 수 있습니다.' }, { label: 빈 목록, name: empty, widget: string }] }
          - { label: 작품 상세 문구, name: artworkDetail, widget: object, fields: [{ label: 목록으로, name: backToWorks, widget: string }, { label: 카테고리, name: category, widget: string }, { label: 영상, name: video, widget: string }, { label: 이전 작품, name: previous, widget: string }, { label: 다음 작품, name: next, widget: string }, { label: 라이트박스 열기, name: openLightbox, widget: string }, { label: 라이트박스 닫기, name: closeLightbox, widget: string }, { label: 확대, name: zoomIn, widget: string }, { label: 축소, name: zoomOut, widget: string }, { label: 확대 초기화, name: resetZoom, widget: string }] }
          - { label: 공통 문구, name: common, widget: object, fields: [{ label: 이미지 준비 문구, name: imagePending, widget: string }, { label: 페이지 준비 문구, name: pagePreparing, widget: string }] }
          - { label: Footer, name: footer, widget: object, fields: [{ label: 저작권 문구, name: copyright, widget: string }] }
          - { label: SEO, name: seo, widget: object, fields: [{ label: 제목, name: title, widget: string }, { label: 설명, name: description, widget: text }, { label: OG 제목, name: ogTitle, widget: string }, { label: OG 설명, name: ogDescription, widget: text }, { label: OG 이미지, name: ogImage, widget: image }] }
      - name: en_site
        label: English site content
        file: content/locales/en/site.json
        fields: *site_fields
  - name: artwork_base
    label: 3. 작품 관리
    files:
      - name: artworks
        label: 작품
        file: content/artworks/index.json
        fields:
          - label: 작품 목록
            name: artworks
            widget: list
            summary: '{{fields.id}} — {{fields.slug}}'
            fields:
              - { label: 고정 ID, name: id, widget: string, hint: '생성 후 변경하지 마세요.' }
              - { label: URL Slug, name: slug, widget: string }
              - { label: 카테고리 ID, name: categoryId, widget: string }
              - { label: 시리즈 ID, name: seriesId, widget: string, required: false }
              - { label: 제작연도, name: year, widget: number, required: false, value_type: int }
              - { label: 작품 이미지, name: image, widget: image }
              - { label: 썸네일, name: thumbnail, widget: image, required: false }
              - { label: 이미지 너비, name: imageWidth, widget: number, value_type: int }
              - { label: 이미지 높이, name: imageHeight, widget: number, value_type: int }
              - { label: 이미지 위치, name: objectPosition, widget: string, required: false, hint: '예: 50% 50%' }
              - { label: 맞춤 방식, name: cropMode, widget: select, options: [contain, cover], required: false }
              - { label: 배경색, name: backgroundColor, widget: color, required: false }
              - { label: Featured, name: featured, widget: boolean, default: false }
              - { label: 공개, name: published, widget: boolean, default: true }
              - { label: 순서, name: order, widget: number, value_type: int }
              - { label: 외부 영상, name: externalVideo, widget: object, required: false, fields: [{ label: 제공자, name: provider, widget: select, options: [youtube, vimeo] }, { label: URL, name: url, widget: string }] }
  - name: artwork_locales
    label: 작품 번역
    files:
      - name: ko_artworks
        label: 한국어 작품 정보
        file: content/locales/ko/artworks.json
        fields: &artwork_translation_fields
          - label: 작품 번역 목록
            name: artworks
            widget: list
            summary: '{{fields.id}} — {{fields.title}}'
            fields:
              - { label: 작품 ID, name: id, widget: string }
              - { label: 제목, name: title, widget: string }
              - { label: 재료, name: medium, widget: string }
              - { label: 크기, name: dimensions, widget: string }
              - { label: 설명, name: description, widget: text, required: false }
              - { label: 대체 텍스트, name: alt, widget: string }
      - name: en_artworks
        label: English artwork content
        file: content/locales/en/artworks.json
        fields: *artwork_translation_fields
  - name: category_base
    label: 4. 작품 분류
    files:
      - name: categories
        label: 카테고리
        file: content/artworks/categories.json
        fields:
          - label: 카테고리 목록
            name: categories
            widget: list
            summary: '{{fields.id}}'
            fields:
              - { label: 고정 ID, name: id, widget: string }
              - { label: 공개, name: published, widget: boolean, default: true }
              - { label: 순서, name: order, widget: number, value_type: int }
  - name: category_locales
    label: 카테고리 번역
    files:
      - name: ko_categories
        label: 한국어 카테고리
        file: content/locales/ko/categories.json
        fields: &category_translation_fields
          - label: 카테고리 번역 목록
            name: categories
            widget: list
            fields:
              - { label: 카테고리 ID, name: id, widget: string }
              - { label: 이름, name: name, widget: string }
      - name: en_categories
        label: English categories
        file: content/locales/en/categories.json
        fields: *category_translation_fields
  - name: about
    label: 2. 작가 소개
    files:
      - name: about_common
        label: About 공통 설정
        file: content/about/index.json
        fields:
          - { label: 작가 이미지, name: portraitImage, widget: image }
          - { label: 작업실 이미지, name: studioImage, widget: image }
          - { label: 대표 작품 ID, name: featuredArtworkId, widget: string, required: false }
          - { label: 작가노트 표시, name: showArtistNote, widget: boolean, default: true }
          - { label: 약력 표시, name: showBiography, widget: boolean, default: true }
          - { label: Statement 표시, name: showStatement, widget: boolean, default: true }
      - name: about_ko
        label: About 한국어
        file: content/locales/ko/about.json
        fields: &about_translation_fields
          - { label: 페이지 제목, name: pageTitle, widget: string }
          - { label: 짧은 소개, name: introduction, widget: text }
          - { label: Biography 문단, name: biography, widget: list, field: { label: 문단, name: paragraph, widget: text } }
          - { label: 작가노트 제목, name: statementTitle, widget: string }
          - { label: 작가노트 문단, name: statement, widget: list, field: { label: 문단, name: paragraph, widget: text } }
          - { label: 인용문, name: quote, widget: text, required: false }
          - { label: 인용 출처, name: quoteAttribution, widget: string, required: false }
          - { label: CV 다운로드 문구, name: downloadCv, widget: string }
      - name: about_en
        label: About English
        file: content/locales/en/about.json
        fields: *about_translation_fields
  - name: cv_common
    label: 5. CV 관리
    files:
      - name: cv
        label: CV
        file: content/cv/index.json
        fields:
          - label: 섹션
            name: sections
            widget: list
            summary: '{{fields.id}}'
            fields:
              - { label: 고정 ID, name: id, widget: string }
              - { label: 순서, name: order, widget: number, value_type: int }
              - { label: 공개, name: published, widget: boolean, default: true }
          - label: 경력 항목
            name: entries
            widget: list
            summary: '{{fields.year}} — {{fields.id}}'
            fields:
              - { label: 고정 ID, name: id, widget: string }
              - { label: 섹션 ID, name: sectionId, widget: string }
              - { label: 시작 연도, name: year, widget: number, value_type: int, required: false }
              - { label: 종료 연도, name: endYear, widget: number, value_type: int, required: false }
              - { label: 순서, name: order, widget: number, value_type: int }
              - { label: 공개, name: published, widget: boolean, default: true }
              - { label: 외부 URL, name: url, widget: string, required: false }
          - label: 언어별 CV PDF
            name: pdf
            widget: object
            fields:
              - { label: 한국어 PDF, name: ko, widget: file, required: false, media_folder: /public/uploads/cv, public_folder: /uploads/cv }
              - { label: English PDF, name: en, widget: file, required: false, media_folder: /public/uploads/cv, public_folder: /uploads/cv }
  - name: cv_locales
    label: CV 번역
    files:
      - name: cv_ko
        label: CV 한국어
        file: content/locales/ko/cv.json
        fields: &cv_translation_fields
          - { label: 페이지 제목, name: pageTitle, widget: string }
          - label: 섹션 제목
            name: sections
            widget: list
            fields:
              - { label: 섹션 ID, name: id, widget: string }
              - { label: 제목, name: title, widget: string }
          - label: 경력 번역
            name: entries
            widget: list
            summary: '{{fields.id}} — {{fields.title}}'
            fields:
              - { label: 항목 ID, name: id, widget: string }
              - { label: 제목, name: title, widget: string }
              - { label: 장소/기관, name: venue, widget: string, required: false }
              - { label: 지역, name: location, widget: string, required: false }
              - { label: 설명, name: description, widget: text, required: false }
          - { label: PDF 다운로드 문구, name: downloadLabel, widget: string }
      - name: cv_en
        label: CV English
        file: content/locales/en/cv.json
        fields: *cv_translation_fields
  - name: news_common
    label: 6. News 관리
    files:
      - name: news
        label: 소식 공통 정보
        file: content/news/index.json
        fields:
          - label: 소식 목록
            name: items
            widget: list
            summary: '{{fields.publishedAt}} — {{fields.slug}}'
            fields:
              - { label: 고정 ID, name: id, widget: string, hint: '생성 후 변경하지 마세요.' }
              - { label: 페이지 주소, name: slug, widget: string }
              - { label: 분류 ID, name: categoryId, widget: string }
              - { label: 시작일 또는 게시일, name: publishedAt, widget: datetime, format: YYYY-MM-DD, date_format: YYYY-MM-DD, time_format: false }
              - { label: 종료일, name: endAt, widget: datetime, format: YYYY-MM-DD, date_format: YYYY-MM-DD, time_format: false, required: false }
              - { label: 목록 이미지, name: thumbnail, widget: image }
              - { label: 대표 이미지, name: image, widget: image }
              - { label: 이미지 너비, name: imageWidth, widget: number, value_type: int }
              - { label: 이미지 높이, name: imageHeight, widget: number, value_type: int }
              - { label: 홈페이지에 공개, name: published, widget: boolean, default: true }
              - { label: 주요 소식, name: featured, widget: boolean, default: false }
              - { label: 표시 순서, name: order, widget: number, value_type: int }
              - { label: 외부 기사 주소, name: externalUrl, widget: string, required: false }
              - { label: 외부 영상, name: externalVideo, widget: object, required: false, fields: [{ label: 서비스, name: provider, widget: select, options: [youtube, vimeo] }, { label: 영상 주소, name: url, widget: string }] }
              - { label: 연관 작품 ID, name: relatedArtworkIds, widget: list, required: false, field: { label: 작품 ID, name: artworkId, widget: string } }
  - name: news_locales
    label: News 언어별 콘텐츠
    files:
      - name: news_ko
        label: News 한국어
        file: content/locales/ko/news.json
        fields: &news_translation_fields
          - { label: 페이지 제목, name: pageTitle, widget: string }
          - { label: 페이지 설명, name: description, widget: text }
          - { label: 전체 보기 문구, name: allLabel, widget: string }
          - { label: 자세히 보기 문구, name: readMore, widget: string }
          - { label: 외부 기사 문구, name: externalLink, widget: string }
          - { label: 목록으로 문구, name: backToNews, widget: string }
          - { label: 이전 소식 문구, name: previous, widget: string }
          - { label: 다음 소식 문구, name: next, widget: string }
          - label: 소식 분류
            name: categories
            widget: list
            fields:
              - { label: 분류 ID, name: id, widget: string }
              - { label: 화면 표시 이름, name: name, widget: string }
          - label: 소식 번역
            name: items
            widget: list
            summary: '{{fields.id}} — {{fields.title}}'
            fields:
              - { label: 소식 ID, name: id, widget: string }
              - { label: 제목, name: title, widget: string }
              - { label: 짧은 소개, name: summary, widget: text }
              - { label: 장소 또는 기관, name: venue, widget: string, required: false }
              - { label: 지역, name: location, widget: string, required: false }
              - { label: 이미지 설명, name: alt, widget: string }
              - label: 본문 블록
                name: content
                widget: list
                fields:
                  - { label: 블록 유형, name: type, widget: select, options: [paragraph, heading, image, quote, video, externalLink] }
                  - { label: 본문 또는 인용문, name: text, widget: text, required: false }
                  - { label: 이미지, name: src, widget: image, required: false }
                  - { label: 이미지 설명, name: alt, widget: string, required: false }
                  - { label: 인용 출처, name: attribution, widget: string, required: false }
                  - { label: 영상 서비스, name: provider, widget: select, options: [youtube, vimeo], required: false }
                  - { label: 링크 또는 영상 주소, name: url, widget: string, required: false }
                  - { label: 링크 문구, name: label, widget: string, required: false }
                  - { label: 영상 제목, name: title, widget: string, required: false }
      - name: news_en
        label: News English
        file: content/locales/en/news.json
        fields: *news_translation_fields
  - name: contact
    label: 7. 연락처 및 SNS
    files:
      - name: contact_common
        label: 연락처 공통 설정
        file: content/contact/index.json
        fields:
          - { label: 이메일, name: email, widget: string, required: false }
          - { label: 전화번호, name: phone, widget: string, required: false }
          - { label: Instagram, name: instagram, widget: string, required: false }
          - { label: YouTube, name: youtube, widget: string, required: false }
          - { label: Vimeo, name: vimeo, widget: string, required: false }
          - { label: Threads, name: threads, widget: string, required: false }
          - { label: 지도 링크, name: addressMapUrl, widget: string, required: false }
          - { label: 이메일 표시, name: showEmail, widget: boolean, default: true }
          - { label: 전화번호 표시, name: showPhone, widget: boolean, default: false }
          - { label: 문의 폼 표시, name: showContactForm, widget: hidden, default: false }
      - name: contact_ko
        label: 연락처 한국어 문구
        file: content/locales/ko/contact.json
        fields: &contact_translation_fields
          - { label: 페이지 제목, name: pageTitle, widget: string }
          - { label: 안내 문구, name: introduction, widget: text }
          - { label: 이메일 항목명, name: emailLabel, widget: string }
          - { label: 전화번호 항목명, name: phoneLabel, widget: string }
          - { label: SNS 항목명, name: socialLabel, widget: string }
          - { label: 지도 링크 문구, name: mapLabel, widget: string }
          - { label: 이메일 복사 문구, name: copyEmail, widget: string }
          - { label: 복사 성공 문구, name: copied, widget: string }
          - { label: 복사 실패 문구, name: copyFailed, widget: string }
          - { label: 답변 안내, name: inquiryNotice, widget: text }
      - name: contact_en
        label: Contact English
        file: content/locales/en/contact.json
        fields: *contact_translation_fields
